services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - om_env
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    restart: unless-stopped

secrets:
  om_env:
    file: ./.env.local
